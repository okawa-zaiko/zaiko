</style>
</head>
<body>

<script src="data_A.js"></script>
<script src="data_B.js"></script>
<script src="data_C.js"></script>
<script>
(function(){
var _R=60;
var _K={n:'現在受注可能数',m:'MAグループ',p:'商品名',d1:'次回入荷日',q1:'次回入荷数量',n1:'次回受注可能数',d2:'次々回入荷日',q2:'次々回入荷数量',n2:'次々回受注可能数',d3:'次々々回入荷日',q3:'次々々回入荷数量',n3:'次々々回受注可能数'};
function _fn(v){var n=parseInt(v);return isNaN(n)?'<span class="ed">―</span>':n+' 本';}
function _fd(v){return(!v||v==='')?'<span class="ed">未定</span>':v;}

var _d=(typeof data_A!=='undefined'?data_A:[]).concat(typeof data_B!=='undefined'?data_B:[],typeof data_C!=='undefined'?data_C:[]);
var _s=sessionStorage.getItem('_s')||''
var _w=_d.map(function(d){
  var _v=parseInt(d[_K.n]||0),_i;

  return[_i,parseInt(d[_K.m]||0),d[_K.p]||'',_fn(d[_K.n]),_fd(d[_K.d1]),_fn(d[_K.q1]),_fn(d[_K.n1]),_fd(d[_K.d2]),_fn(d[_K.q2]),_fn(d[_K.n2]),_fd(d[_K.d3]),_fn(d[_K.q3]),_fn(d[_K.n3]),_v];
});
var _dt=$('#zt').DataTable({
  data:_w,
  columns:[

    {orderable:true,type:'num',className:'vc',width:'60px'},

    {orderable:true,className:'dc2',width:'90px'},
    {orderable:true,className:'vc',width:'80px'},
    {orderable:true,className:'vc',width:'90px'},
    {orderable:true,className:'dc2',width:'90px'},
    {orderable:true,className:'vc',width:'80px'},
    {orderable:true,className:'vc',width:'90px'},
    {orderable:true,className:'dc2',width:'90px'},
    {orderable:true,className:'vc',width:'80px'},
    {orderable:true,className:'vc',width:'100px'},
    {visible:false}
  ],
  order:[[1,'asc'],[2,'asc']],
  pageLength:200,

  createdRow:function(row,data){var v=parseInt(data[13]);if(v<0)$(row).addClass('sm');else if(v===0)$(row).addClass('sz');},

document.getElementById('lu').textContent='最終更新: '+_f2(_now.getMonth()+1)+'/'+_f2(_now.getDate())+' '+_f2(_now.getHours())+':'+_f2(_now.getMinutes())+':'+_f2(_now.getSeconds());
document.getElementById('ov').style.display='none';
_cd();
function _sp(api){
  var _o=api.order();
  if(!(_o.length>0&&_o[0][0]===1))return;
  var _tb=document.querySelector('#zt tbody'),_tr=Array.from(_tb.querySelectorAll('tr:not(.ms)'));
  _tb.querySelectorAll('tr.ms').forEach(function(r){r.remove();});
  var _pm=null;

  },1000);
}
})();
</script>
